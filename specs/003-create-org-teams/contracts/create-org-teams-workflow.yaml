name: create-org-teams-workflow-contract
version: 1
purpose: >-
  Contract for the IssueOps workflow that requests approval for, validates, and
  reconciles creating one or more empty teams in a GitHub organization from the
  central administration repository.

issue_form:
  path: .github/ISSUE_TEMPLATE/create-org-teams.yml
  required_fields:
    - id: organization
      type: input
      description: Target GitHub organization slug.
    - id: intended_owner
      type: input
      description: GitHub login of the single intended owner who must approve the full request batch.
    - id: requested_team_names
      type: textarea
      description: One or more requested team names, one per line.
    - id: business_justification
      type: textarea
      description: Reason for creating the requested teams.
    - id: dry_run
      type: dropdown
      description: Whether to execute validation only or allow creation after approval.

parser:
  action: issue-ops/parser@v5
  inputs:
    body: ${{ github.event.issue.body }}
    issue-form-template: create-org-teams.yml
  outputs:
    json: Parsed request payload as JSON string.
    parsed_organization: Normalized organization field.
    parsed_intended_owner: Normalized intended-owner field.
    parsed_requested_team_names: Parsed team-name list before downstream normalization.
    parsed_dry_run: Parsed dry-run selection.

workflow_inputs:
  validation:
    - name: organization
      required: true
    - name: intended_owner
      required: true
    - name: requested_team_names
      required: true
    - name: requester_login
      required: true
    - name: dry_run
      required: true
  approval_gate:
    - name: approver_login
      required: true
    - name: intended_owner
      required: true
  reconciliation:
    - name: execution_token_source
      required: true
      description: PAT-backed workflow token source.
    - name: audit_artifact_path
      required: true
      description: Persisted validation and approval artifact used by the execution runner.
  workflow_env:
    - name: ISSUEOPS_GITHUB_TOKEN
      required: true
      description: PAT-backed organization secret used for validation, approval verification, and team creation.
    - name: GITHUB_TOKEN
      required: true
      description: Default GitHub Actions repository token used for standard workflow context operations.

authorization:
  requester_identity: github.event.issue.user.login
  allowed_approvers:
    - single intended owner designated for the full request batch
  execution_identity:
    model: personal access token supplied to the workflow from ISSUEOPS_GITHUB_TOKEN
    bootstrap: repository or organization Actions secret injection
    required_permissions:
      members: write
      metadata: read
      issues: write

validation_rules:
  - The target organization must exist and be visible to the executing identity.
  - At least one requested team must be supplied after normalization.
  - Duplicate or conflicting normalized team slugs must be rejected before reconciliation.
  - The intended owner must be an active member of the target organization.
  - Approval must be present as an issue comment containing exactly `approved` and must be granted by the intended owner.
  - Team member names, repo grants, and parent-team inputs must not be accepted by this workflow.

reconciliation:
  current_state_reads:
    - target organization visibility lookup
    - existing team-by-slug lookup for each requested team
    - intended-owner organization membership lookup
  mutation_rule: Create only missing teams in the target organization.
  no_op_rule: Report already existing teams without rewriting them.
  partial_success_rule: Persist per-team success or failure and surface required follow-up.

rate_limit_handling:
  inspect_headers:
    - x-ratelimit-remaining
    - x-ratelimit-reset
    - retry-after
  retry_policy:
    strategy: bounded exponential backoff
    retryable_conditions:
      - transient secondary rate limit
      - explicit retry-after guidance
    non_retryable_conditions:
      - invalid approval
      - malformed team definition
      - missing target organization
      - conflicting normalized team slug

observability:
  outputs:
    - GitHub step summary
    - JSON audit artifact
    - requester-facing workflow summary in the Actions run
  required_fields:
    - issue_number
    - run_id
    - requester_login
    - approver_login
    - organization
    - intended_owner
    - requested_team_names
    - created_teams
    - noop_teams
    - failed_teams
    - rollback_status
    - reconciliation.teams_to_create
    - reconciliation.teams_already_present
  operator_notes:
    - Central assignment is queue ownership only and does not authorize team creation.
    - Successful team creation summaries must note that GitHub automatically makes the authenticated creator a team maintainer.