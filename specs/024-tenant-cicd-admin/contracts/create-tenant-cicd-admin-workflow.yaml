name: create-tenant-cicd-admin-workflow-contract
version: 1
purpose: >-
  Contract for extending tenant bootstrap to include deterministic CICDAdmin team
  creation and safe CI/CD capability intent handling under least-privilege policy.

implementation_status: complete_phase_5_testing
last_validated: 2026-06-12
validation_notes: >-
  Phase 5 (US3) testing complete: 64/64 tests passing (13 compatibility +
  22 registry + 19 integration + baseline). All CICD capability, topology
  relation, and non-regression requirements validated. Phase 6 polish in progress.
validated_against:
  - issue_form: .github/ISSUE_TEMPLATE/create-tenant-model.yml
  - workflow: .github/workflows/create-tenant-model.yml
  - scripts:
      - src/scripts/run-request-validation.js
      - src/scripts/run-approval-gate.js
      - src/scripts/run-approved-execution.js
      - src/scripts/emit-audit-summary.js
  - modules:
      - src/workflow-support/parse-tenant-creation-request.js
      - src/workflow-support/validate-tenant-creation-request.js
      - src/workflow-support/reconcile-tenant-creation.js
      - src/workflow-support/persist-tenant-registry-record.js
      - src/workflow-support/build-audit-artifact.js
      - src/workflow-support/build-execution-outcome.js
      - src/workflow-support/handle-rate-limit.js

issue_form:
  path: .github/ISSUE_TEMPLATE/create-tenant-model.yml
  required_fields:
    - id: organization
      type: input
    - id: tenant_name
      type: input
    - id: designated_approver
      type: input
    - id: dry_run
      type: dropdown
    - id: justification
      type: textarea

parser:
  action: issue-ops/parser@v5
  outputs:
    - json
    - parsed_organization
    - parsed_tenant_name
    - parsed_designated_approver
    - parsed_dry_run
    - parsed_justification

workflow_entry_assumptions:
  create_tenant_model_workflow:
    events:
      issues:
        - opened
        - edited
        - reopened
        - labeled
      issue_comment:
        - created
        - edited
        - deleted
    applicability_gate:
      required_parser_outputs:
        - parsed_organization
        - parsed_tenant_name
        - parsed_designated_approver
    execution_gate:
      approval_output_key: approval-status
      required_expression: steps.approval_gate.outputs['approval-status'] == 'approved'

authorization:
  requester_identity: github.event.issue.user.login
  approver_model: designated active target organization owner
  central_assignment_semantics: routing only; never approval evidence
  execution_identity:
    credential: ISSUEOPS_GITHUB_TOKEN
    least_privilege: true

validation_rules:
  - Preserve all baseline validation rules from specs/014-create-tenant-model/spec.md.
  - Derived team names are exactly <TenantName>_Tenant, <TenantName>_RepoAdmins, and <TenantName>_Tenant_CICDAdmin.
  - Derived slugs must be deterministic, valid, and non-conflicting.
  - CICDAdmin hierarchy relationship is deterministic: <TenantName>_Tenant_CICDAdmin must be direct child of <TenantName>_Tenant.
  - Re-parenting <TenantName>_Tenant_CICDAdmin from any different current parent is blocked in this version.
  - CICDAdmin topology structure entry must reflect parent <TenantName>_Tenant and child <TenantName>_Tenant_CICDAdmin.
  - Topology parent conflicts for CICDAdmin are blocked in this version.
  - CI/CD capability path must pass prerequisite and safety-policy checks before mutation.
  - Unsafe paths implying unauthorized broad org-wide privilege expansion are rejected.
  - Organization-owner grant is prohibited for this feature.

reconciliation:
  current_state_reads:
    - organization visibility and capability prerequisites
    - existing derived teams and slugs
    - current hierarchy parent-child relationships
    - requester membership/role on tenant parent team
    - existing capability assignment state for approved path targets
    - existing tenant registry record path/state
  mutation_rule:
    - create missing derived teams only
    - link derived child teams only when missing
    - persist CICDAdmin parent-child relation in topology.teams.structure when missing
    - preserve requester maintainer bootstrap semantics from baseline
    - apply capability assignment only when selected path is policy-approved and safe
  no_op_rule:
    - existing team/hierarchy state and already-satisfied capability assignments remain unchanged
  stale_state_rule: recompute current state before mutation
  rerun_rule: idempotent no duplicate side effects
  dry_run_rule: emit full reconciliation and capability intent with no mutation

capability_assignment:
  intent_model: tenant_cicd_admin
  decision_matrix:
    - id: primary_apply
      when:
        - org capability prerequisites available
        - policy approves primary path
        - scope constrained to tenant-safe boundaries
      selected_path: primary
      outcome_status: applied
    - id: fallback_apply
      when:
        - primary path unavailable
        - tenant-owned repository scope resolvable
        - policy approves fallback path
        - fallback does not imply broad org-wide expansion
      selected_path: fallback
      outcome_status: applied
    - id: blocked_unsafe_scope
      when:
        - any path requires unauthorized broad org-wide privilege expansion
      selected_path: none
      outcome_status: blocked
      reason_code: unsafe_scope
    - id: unavailable_capability
      when:
        - neither primary nor fallback path prerequisites available
      selected_path: none
      outcome_status: unavailable
      reason_code: capability_unavailable
    - id: failed_execution
      when:
        - selected path is policy-approved but execution fails non-retryably or exhausts retry budget
      outcome_status: failed
      reason_code: execution_failed
  primary_path:
    allowed_when:
      - target org capability is available
      - policy approves selected path
      - scope can be constrained to tenant-safe boundaries
    blocked_when:
      - capability support unavailable
      - policy denies path
      - scope cannot be safely constrained
  fallback_path:
    strategy: repository-scoped permissions on tenant-owned repositories only
    allowed_when:
      - tenant-owned repository set is resolvable
      - fallback does not imply broad org-wide privilege expansion
  fail_closed_rule: >-
    If no safe path exists to represent tenant CI/CD admin capability, do not grant
    broad privilege; emit blocked/unavailable outcome with remediation guidance.
  prohibited:
    - organization owner grants
    - unconditional org-wide CI/CD administrative grants

registry_persistence:
  path_pattern: tenant-registry/<tenant_key>.json
  topology_update:
    path: topology.teams.structure
    required_relation:
      parent: <TenantName>_Tenant
      child: <TenantName>_Tenant_CICDAdmin
    conflict_behavior: blocked
    idempotent_noop: true
  required_extension_fields:
    - cicd_admin_team_name
    - cicd_admin_team_slug
    - cicd_capability_status
    - cicd_capability_reason_code
    - cicd_capability_evidence_ref

observability:
  outputs:
    - github_step_summary
    - json_audit_artifact
  required_fields:
    - issue_number
    - run_id
    - requester_login
    - approver_login
    - organization
    - tenant_key
    - derived_team_outcomes
    - cicd_capability_selected_path
    - cicd_capability_status
    - cicd_capability_reason_code
    - cicd_topology_update_outcome
    - final_request_status
    - rollback_status

rate_limit_handling:
  strategy: bounded_exponential_backoff
  inspect_headers:
    - x-ratelimit-remaining
    - x-ratelimit-reset
    - retry-after
  retryable_conditions:
    - transient 5xx responses
    - secondary rate limit responses
    - explicit retry-after guidance
  non_retryable_conditions:
    - unauthorized approver
    - missing target organization
    - unsafe capability path policy rejection
    - missing/insufficient credential
