name: create-tenant-repos-workflow-contract
version: 2
purpose: >-
  Contract for the tenant-scoped repository-creation IssueOps workflow that
  resolves canonical tenant context from tenant-registry plus live governance
  state, enforces context-bound approval, creates one repository in the target
  organization, grants admin permission to the tenant repo-admin team, and
  emits durable audit evidence.

implementation_status: complete
last_validated: 2026-05-29
validated_against:
  - issue_form: .github/ISSUE_TEMPLATE/create-tenant-repos.yml
  - workflow: .github/workflows/create-tenant-repos.yml
  - scripts:
      - src/scripts/run-request-validation.js
      - src/scripts/run-approval-gate.js
      - src/scripts/run-approved-execution.js
  - modules:
      - src/workflow-support/parse-tenant-repo-request.js
      - src/workflow-support/resolve-tenant-context-from-registry.js
      - src/workflow-support/validate-tenant-repo-request.js
      - src/workflow-support/reconcile-tenant-repo-creation.js
      - src/workflow-support/approval-gate.js
      - src/workflow-support/build-audit-artifact.js
      - src/workflow-support/build-execution-outcome.js
      - src/workflow-support/github-team-repo-api.js
      - src/actions/repo-creation-policy/index.js
      - src/actions/repo-permission-policy/index.js

issue_form:
  path: .github/ISSUE_TEMPLATE/create-tenant-repos.yml
  required_fields:
    - id: organization
      type: input
      parsed_env_key: PARSED_ORGANIZATION
    - id: tenant_name
      type: input
      parsed_env_key: PARSED_TENANT_NAME
      note: >-
        Human-readable tenant name exactly as stored in tenant_display_name in
        the tenant-registry record for the target organization. Used to
        disambiguate when a requester is maintainer of multiple tenants.
    - id: repository_name
      type: input
      parsed_env_key: PARSED_REPOSITORY_NAME
    - id: designated_approver
      type: input
      parsed_env_key: PARSED_DESIGNATED_APPROVER
    - id: dry_run
      type: dropdown
      default: "true"
      parsed_env_key: PARSED_DRY_RUN
    - id: justification
      type: textarea
      parsed_env_key: PARSED_JUSTIFICATION

parser:
  action: issue-ops/parser@v5
  outputs:
    - json
    - parsed_organization
    - parsed_tenant_name
    - parsed_repository_name
    - parsed_designated_approver
    - parsed_dry_run
    - parsed_justification

request_normalization:
  tenant_name_input: raw value from parsed_tenant_name (trimmed)
  tenant_name_normalized: >-
    lowercase, leading/trailing whitespace stripped, internal runs of whitespace
    collapsed to a single space; used for case-insensitive registry matching
  repository_name_normalized: >-
    lowercase, trimmed, forward slashes stripped; used as the target repository
    slug and for context marker computation

workflow_entry_assumptions:
  create_tenant_repos_workflow:
    events:
      issues:
        - opened
        - edited
        - reopened
        - labeled
      issue_comment:
        - created
        - edited
        - deleted
    concurrency:
      group: create-tenant-repos-{issue_number}
      cancel_in_progress: false
    applicability_gate:
      required_parser_outputs:
        - parsed_organization
        - parsed_tenant_name
        - parsed_repository_name
        - parsed_designated_approver
    execution_gate:
      approval_output_key: approval-status
      required_expression: steps.approval_gate.outputs['approval-status'] == 'approved'
    workflow_permissions:
      actions: read
      contents: read
      issues: write
      note: >-
        Repository creation and team-permission mutation use ISSUEOPS_GITHUB_TOKEN.
        issues:write is required for terminal-state label application on the
        workflow's own GitHub token (github.token). Workflow-level contents write
        is not required because durable audit persistence uses retained workflow
        artifacts rather than repository writeback.
    terminal_state_labels:
      prefix: "issueops:create-tenant-repos:"
      values:
        - issueops:create-tenant-repos:executed
        - issueops:create-tenant-repos:failed
        - issueops:create-tenant-repos:partially_executed
      ensure_step: >-
        Labels are idempotently created via 'gh label create --force' before
        the approved-execution step runs, guarded by the same approval-status
        condition.
      applied_on: approved execution completion (terminal request_status)

authorization:
  requester_identity: github.event.issue.user.login
  approver_model: designated currently authorized target-organization approver bound to latest validated context
  requester_tenant_requirements:
    - requester must resolve to exactly one valid X_Tenant for the request context
    - requester must be active maintainer of X_Tenant
    - requester must be active member of X_RepoAdmin
  central_assignment_semantics: >-
    routing only; central assignment via addIssueAssignees is queue ownership
    only and never authorizes the tenant repository creation mutation
  execution_identity:
    credential: ISSUEOPS_GITHUB_TOKEN
    token_kind: pat
    least_privilege: true
    fail_closed: >-
      execution is blocked if ISSUEOPS_GITHUB_TOKEN is missing or if the token
      fails the PAT-backed check in assertRepositoryCreationAllowed

tenant_resolution:
  authoritative_registry_source: tenant-registry/ on repository main branch
  registry_ref_env_key: TENANT_REGISTRY_REF
  registry_dir_env_key: TENANT_REGISTRY_DIR
  required_inputs:
    - requester identity
    - target organization
    - tenant_name_normalized (pre-filters registry records by display name before auth check)
    - registry record
    - live tenant-pattern team matching
    - live X_Tenant -> X_RepoAdmin relationship
  resolution_algorithm: >-
    1. Load all .json records from tenant-registry/ whose organization matches
       the target organization.
    2. If tenant_name_normalized is provided, filter to records whose
       tenant_display_name normalizes to the same value.
    3. For each remaining record, evaluate requester authorization: requester
       must be active maintainer of X_Tenant and active member of X_RepoAdmin,
       and X_RepoAdmin must be a direct child of X_Tenant.
    4. Resolution outcome is 'resolved' (exactly 1 authorized), 'ambiguous'
       (>1 authorized), or 'no_match' (0 authorized).
  fail_closed_conditions:
    - no tenant match (no_match)
    - ambiguous tenant match (ambiguous)
    - missing registry record
    - malformed registry record
    - registry/live state conflict (registry_conflict)
    - missing X_RepoAdmin
    - X_RepoAdmin not child of X_Tenant
    - tenant_name_input field missing or empty

context_marker:
  format: "tenant-repo-context:{16-char-sha256-hex}"
  inputs:
    - operation (literal 'tenant_repo_creation')
    - organization (normalized)
    - repository_name_normalized
    - designated_approver_login (normalized)
    - tenant_key (normalized)
    - tenant_team_slug (normalized)
    - repo_admin_team_slug (normalized)
    - registry_ref
  purpose: >-
    Binds approval to a specific validated request state. If any input changes
    (e.g. request edited, tenant re-resolved), the marker changes and a prior
    approval is invalidated.

approval:
  mode: context_bound
  binding: approved_context_marker must equal latest_context_marker at execution time
  invalidation_condition: latest context marker differs from approved context marker
  stale_approval_outcome: approval_status set to 'invalidated'; request reverts to awaiting_approval
  authorized_approver_role: target_org_owner (active admin of the target organization)
  designated_approver_check: commenter login must match designated_approver_login from request
  denied_roles:
    - central_assignment (queue owner)
    - other (any non-designated commenter)
  denial_note_pattern: "does not authorize tenant repository creation mutation"

validation_rules:
  - tenant_name_input is required; validation fails immediately if absent or empty.
  - Repository name must normalize deterministically into a safe repository slug.
  - Canonical tenant context must resolve to exactly one authorized match from authoritative registry and live org state.
  - Requester must be active maintainer of exactly one valid X_Tenant for this request context.
  - Requester must be an active member of X_RepoAdmin.
  - X_RepoAdmin must be a direct child team of X_Tenant.
  - Designated approver must be currently authorized (active admin) for the resolved organization context.
  - Validation must produce a context marker used to bind approval to latest validated state.
  - Dry-run requests pass validation and produce mutation intent but must not execute any mutation.

reconciliation:
  current_state_reads:
    - organization visibility
    - authoritative tenant-registry record from main branch
    - X_Tenant membership and maintainer role for requester
    - X_RepoAdmin membership for requester
    - X_Tenant -> X_RepoAdmin parent-child relationship
    - target repository existence
    - current X_RepoAdmin team permission on target repository
  mutation_rule:
    - create repository only when it does not already exist (creation_action = create_repository)
    - grant admin permission to X_RepoAdmin only when current permission is below admin (permission_action = grant_admin)
    - do not grant direct individual admin under any circumstances
  no_op_rule:
    - existing repository: creation_action = noop
    - X_RepoAdmin already holds admin: permission_action = noop
    - both noop produces executed status with noop_count >= 2
  blocked_rule:
    - boundary_mismatch: requester authorization or governance relationship changed between validation and execution
    - missing_tenant_context: resolved context is absent at execution time
  stale_state_rule: recompute current state and boundary context before mutation
  rerun_rule: idempotent; no duplicate repository creation or team-permission changes
  dry_run_rule: emit tenant resolution and mutation intent with no mutation; validation passes but execution is blocked
  direct_admin_avoidance: enforced_team_only

execution:
  policy_guards:
    - assertRepositoryCreationAllowed: checks approval_status=approved, approver_role=target_org_owner, authorizations_state=authorized, PAT-backed token
    - assertRepoAdminTeamPermissionAllowed: checks approval, role, repo_admin_team_slug present, PAT-backed token
  mutation_order:
    - 1. createOrganizationRepository (if creation_action = create_repository)
    - 2. addOrUpdateTeamRepositoryPermission to X_RepoAdmin with admin (if permission_action = grant_admin)
  partial_failure_handling: >-
    Each step is attempted independently. If repository creation succeeds but
    admin grant fails, request_status becomes 'failed' (not 'partially_executed')
    because the governance posture is incomplete. rollback_status is set to
    'manual_remediation_required'.
  audit_persistence:
    result_field: audit_persistence_result
    values: [persisted, failed, pending]
    failure_handling: non-fatal; logged as warning; execution status may degrade

observability:
  persistence_model: retained workflow artifact plus github step summary
  outputs:
    - github_step_summary
    - json_audit_artifact
  artifact_requirements:
    upload_on:
      - validation
      - approval
      - approved_execution
    retention_policy_source: AUDIT_ARTIFACT_RETENTION_DAYS env variable (default 30 days)
    artifact_name_pattern: "create-tenant-repos-execution-{issue_number}-{run_attempt}"
  audit_artifact_fields:
    request:
      - request_id
      - issue_number
      - repository
      - requester_login
      - organization
      - tenant_name_input
      - tenant_name_normalized
      - repository_name_input
      - repository_name_normalized
      - designated_approver_login
      - dry_run
      - intake_mode (always 'manual' for this workflow)
      - request_status
      - context_marker
      - tenant_key
      - tenant_team_slug
      - repo_admin_team_slug
    validation:
      - is_valid
      - validation_status
      - errors
      - warnings
      - tenant_resolution (status, match_count, candidates)
      - available_tenant_display_names
      - designated_approver_authorization
      - repository_exists
      - current_repo_admin_permission
    approval:
      - approval_status
      - approver_login
      - approver_role
      - approver_authorization_state
      - approved_context_marker
      - latest_context_marker
      - decision_note
    reconciliation:
      - creation_action
      - permission_action
      - boundary_revalidation_status
      - blocked_reason
      - direct_admin_avoidance
    execution:
      - repository_creation_result
      - repo_admin_grant_result
      - audit_persistence_result
      - mutation_count
      - noop_count
      - failure_count
      - rollback_status
      - summary
  lifecycle_states:
    - submitted
    - awaiting_approval
    - approved
    - validation_failed
    - executed
    - failed
    - partially_executed
    - blocked

rate_limit_handling:
  strategy: bounded_exponential_backoff
  inspect_headers:
    - x-ratelimit-remaining
    - x-ratelimit-reset
    - retry-after
  retryable_conditions:
    - transient 5xx responses
    - secondary rate limit responses (429 with retry-after)
    - explicit retry-after guidance
  non_retryable_conditions:
    - ambiguous tenant resolution
    - unauthorized approver
    - invalid repository name normalization
    - missing X_RepoAdmin
    - governance relationship conflict
    - missing or insufficient credential for boundary-critical reads
    - boundary mismatch at execution time