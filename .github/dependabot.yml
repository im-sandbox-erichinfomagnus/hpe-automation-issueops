version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "013-setup-feature-branch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "013-setup-feature-branch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
