name: lint-workflows

on:
  pull_request:
    paths:
      - .github/workflows/*.yml
      - .github/ISSUE_TEMPLATE/*.yml
  push:
    branches:
      - main
      - 013-setup-feature-branch
    paths:
      - .github/workflows/*.yml
      - .github/ISSUE_TEMPLATE/*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint GitHub workflow files
        uses: rhysd/actionlint@v1.7.12
