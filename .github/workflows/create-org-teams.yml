name: create-org-teams

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
  issue_comment:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:
    inputs:
      issue-number:
        description: Existing issue number to replay for validation.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: create-org-teams-${{ github.event.issue.number || inputs.issue-number || github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue-number || '' }}
      AUDIT_ARTIFACT_PATH: artifacts/create-org-teams-validation-${{ github.event.issue.number || inputs.issue-number || 'manual' }}.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve issue context
        id: issue_context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issues" ] || [ "$EVENT_NAME" = "issue_comment" ]; then
            issue_body=$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")
            requester_login=$(jq -r '.issue.user.login // ""' "$GITHUB_EVENT_PATH")
          else
            if [ -z "$ISSUE_NUMBER" ]; then
              echo "workflow_dispatch requires an issue number to replay" >&2
              exit 1
            fi

            issue_json=$(curl --silent --show-error --fail \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/issues/$ISSUE_NUMBER")

            issue_body=$(printf '%s' "$issue_json" | jq -r '.body // ""')
            requester_login=$(printf '%s' "$issue_json" | jq -r '.user.login // ""')
          fi

          echo "requester_login=$requester_login" >> "$GITHUB_OUTPUT"
          {
            echo 'issue_body<<EOF'
            printf '%s\n' "$issue_body"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Parse issue body
        id: parse_request
        uses: issue-ops/parser@v5
        with:
          body: ${{ steps.issue_context.outputs.issue_body }}
          issue-form-template: create-org-teams.yml

      - name: Check request applicability
        id: request_scope
        env:
          PARSED_ORGANIZATION: ${{ steps.parse_request.outputs.parsed_organization }}
          PARSED_INTENDED_OWNER: ${{ steps.parse_request.outputs.parsed_intended_owner }}
