          if [ -n "${PARSED_INTENDED_OWNER:-}" ]; then
>>>>>>> origin/main
            matches_request=true
          fi

          echo "matches-request=$matches_request" >> "$GITHUB_OUTPUT"

      - name: Skip unrelated issue form
        if: ${{ steps.request_scope.outputs.matches-request != 'true' }}
        run: |
          echo 'This issue does not match the create-org-teams form. Exiting without validation or assignment.' >> "$GITHUB_STEP_SUMMARY"

      - name: Restore prior request audit artifact
        if: ${{ steps.request_scope.outputs.matches-request == 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AUDIT_ARTIFACT_PATH: ${{ env.AUDIT_ARTIFACT_PATH }}
        run: node src/scripts/restore-request-audit-artifact.js

      - name: Validate request and record approval-ready state
        id: validate_request
        if: ${{ steps.request_scope.outputs.matches-request == 'true' }}
        env:
          ISSUEOPS_GITHUB_TOKEN: ${{ secrets.ISSUEOPS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          REQUESTER_LOGIN: ${{ steps.issue_context.outputs.requester_login }}
          PARSED_REQUEST_JSON: ${{ steps.parse_request.outputs.json }}
          PARSED_ORGANIZATION: ${{ steps.parse_request.outputs.parsed_organization }}
          PARSED_INTENDED_OWNER: ${{ steps.parse_request.outputs.parsed_intended_owner }}
          PARSED_INTAKE_MODE: ${{ steps.parse_request.outputs.parsed_intake_mode }}
          PARSED_REQUESTED_TEAM_NAMES: ${{ steps.parse_request.outputs.parsed_requested_team_names }}
          PARSED_BULK_CSV_REQUESTED_TEAM_NAMES: ${{ steps.parse_request.outputs.parsed_bulk_csv_requested_team_names }}
          PARSED_BUSINESS_JUSTIFICATION: ${{ steps.parse_request.outputs.parsed_business_justification }}
          PARSED_DRY_RUN: ${{ steps.parse_request.outputs.parsed_dry_run }}
          COMMENT_ID: ${{ github.event.comment.id || '' }}
          COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          ISSUE_LABELS_JSON: ${{ toJson(github.event.issue.labels || fromJson('[]')) }}
          AUDIT_ARTIFACT_PATH: ${{ env.AUDIT_ARTIFACT_PATH }}
        run: node src/scripts/run-request-validation.js

      - name: Evaluate approval gate and assign central owner
        id: approval_gate
        if: ${{ always() && steps.request_scope.outputs.matches-request == 'true' && steps.validate_request.outcome != 'skipped' }}
        env:
          ISSUEOPS_GITHUB_TOKEN: ${{ secrets.ISSUEOPS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          AUDIT_ARTIFACT_PATH: ${{ env.AUDIT_ARTIFACT_PATH }}
        run: node src/scripts/run-approval-gate.js

      - name: Execute approved reconciliation
        id: execute_request
        if: ${{ always() && steps.request_scope.outputs.matches-request == 'true' && steps.approval_gate.outputs.approval-status == 'approved' }}
        env:
          ISSUEOPS_GITHUB_TOKEN: ${{ secrets.ISSUEOPS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          AUDIT_ARTIFACT_PATH: ${{ env.AUDIT_ARTIFACT_PATH }}
        run: node src/scripts/run-approved-execution.js

      - name: Upload validation artifact
        if: ${{ always() && steps.request_scope.outputs.matches-request == 'true' && steps.validate_request.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: create-org-teams-validation-${{ env.ISSUE_NUMBER || github.run_id }}
          path: ${{ env.AUDIT_ARTIFACT_PATH }}
          if-no-files-found: error