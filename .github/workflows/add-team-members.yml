name: add-team-members

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
  issue_comment:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:
    inputs:
      issue-number:
        description: Existing issue number to replay for validation or execution.
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: add-team-members-${{ github.event.issue.number || inputs.issue-number || github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue-number || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve issue context
        id: issue_context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issues" ] || [ "$EVENT_NAME" = "issue_comment" ]; then
            issue_body=$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")
            requester_login=$(jq -r '.issue.user.login // ""' "$GITHUB_EVENT_PATH")
          else
            if [ -z "$ISSUE_NUMBER" ]; then
              echo "workflow_dispatch requires an issue number to replay" >&2
              exit 1
            fi

            issue_json=$(curl --silent --show-error --fail \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/issues/$ISSUE_NUMBER")

            issue_body=$(printf '%s' "$issue_json" | jq -r '.body // ""')
            requester_login=$(printf '%s' "$issue_json" | jq -r '.user.login // ""')
          fi

          echo "requester_login=$requester_login" >> "$GITHUB_OUTPUT"
          {
            echo 'issue_body<<EOF'
            printf '%s\n' "$issue_body"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Parse issue body
        id: parse_request
        uses: issue-ops/parser@v5
        with:
          body: ${{ steps.issue_context.outputs.issue_body }}
          issue-form-template: add-team-members.yml

      - name: Check request applicability
        id: request_scope
        env:
          PARSED_TEAM_SLUG: ${{ steps.parse_request.outputs.parsed_team_slug }}
          PARSED_REQUESTED_PEOPLE: ${{ steps.parse_request.outputs.parsed_requested_people }}
          PARSED_BULK_CSV_REQUESTED_PEOPLE: ${{ steps.parse_request.outputs.parsed_bulk_csv_requested_people }}
        run: |
          set -euo pipefail

          matches_request=false
          if [ -n "${PARSED_TEAM_SLUG:-}" ] && { [ -n "${PARSED_REQUESTED_PEOPLE:-}" ] || [ -n "${PARSED_BULK_CSV_REQUESTED_PEOPLE:-}" ]; }; then
            matches_request=true
          fi

          echo "matches-request=$matches_request" >> "$GITHUB_OUTPUT"

      - name: Skip unrelated issue form
        if: ${{ steps.request_scope.outputs.matches-request != 'true' }}
        run: |
          echo 'This issue does not match the add-team-members form. Exiting without validation or assignment.' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate request and record approval-ready state
        id: validate_request
        if: ${{ steps.request_scope.outputs.matches-request == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ISSUEOPS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          REQUESTER_LOGIN: ${{ steps.issue_context.outputs.requester_login }}
          PARSED_REQUEST_JSON: ${{ steps.parse_request.outputs.json }}
          PARSED_ORGANIZATION: ${{ steps.parse_request.outputs.parsed_organization }}
          PARSED_TEAM_SLUG: ${{ steps.parse_request.outputs.parsed_team_slug }}
          PARSED_REQUESTED_PEOPLE: ${{ steps.parse_request.outputs.parsed_requested_people }}
          PARSED_BULK_CSV_REQUESTED_PEOPLE: ${{ steps.parse_request.outputs.parsed_bulk_csv_requested_people }}
          PARSED_BUSINESS_JUSTIFICATION: ${{ steps.parse_request.outputs.parsed_business_justification }}
          PARSED_DRY_RUN: ${{ steps.parse_request.outputs.parsed_dry_run }}
          AUDIT_ARTIFACT_PATH: artifacts/add-team-members-validation-${{ env.ISSUE_NUMBER || 'manual' }}.json
        run: node src/scripts/run-request-validation.js

      - name: Evaluate approval gate
        id: approval_gate
        if: ${{ always() && steps.request_scope.outputs.matches-request == 'true' && steps.validate_request.outcome != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ISSUEOPS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          AUDIT_ARTIFACT_PATH: artifacts/add-team-members-validation-${{ env.ISSUE_NUMBER || 'manual' }}.json
        run: node src/scripts/run-approval-gate.js

      - name: Execute approved reconciliation
        id: execute_request
        if: ${{ always() && steps.request_scope.outputs.matches-request == 'true' && steps.approval_gate.outputs.approval-status == 'approved' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ISSUEOPS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          AUDIT_ARTIFACT_PATH: artifacts/add-team-members-validation-${{ env.ISSUE_NUMBER || 'manual' }}.json
        run: node src/scripts/run-approved-execution.js

      - name: Upload request audit artifact
        if: ${{ always() && steps.request_scope.outputs.matches-request == 'true' && steps.validate_request.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: add-team-members-validation-${{ env.ISSUE_NUMBER || github.run_id }}
          path: artifacts/add-team-members-validation-${{ env.ISSUE_NUMBER || 'manual' }}.json
          if-no-files-found: error
