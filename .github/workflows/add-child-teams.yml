name: add-child-teams

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
  issue_comment:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:
    inputs:
      issue-number:
        description: Existing issue number to replay for scaffold validation.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: add-child-teams-${{ github.event.issue.number || inputs.issue-number || github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue-number || '' }}
      AUDIT_ARTIFACT_PATH: artifacts/add-child-teams-validation-${{ github.event.issue.number || inputs.issue-number || 'manual' }}.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve issue context
        id: issue_context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issues" ] || [ "$EVENT_NAME" = "issue_comment" ]; then
            issue_body=$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")
            requester_login=$(jq -r '.issue.user.login // ""' "$GITHUB_EVENT_PATH")
            issue_labels_json=$(jq -c '.issue.labels // []' "$GITHUB_EVENT_PATH")
          else
            if [ -z "$ISSUE_NUMBER" ]; then
              echo "workflow_dispatch requires an issue number to replay" >&2
              exit 1
            fi

            issue_json=$(curl --silent --show-error --fail \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/issues/$ISSUE_NUMBER")

            issue_body=$(printf '%s' "$issue_json" | jq -r '.body // ""')
            requester_login=$(printf '%s' "$issue_json" | jq -r '.user.login // ""')
            issue_labels_json=$(printf '%s' "$issue_json" | jq -c '.labels // []')
          fi

          {
            echo "requester_login=$requester_login"
            echo "issue_labels_json=$issue_labels_json"
            echo 'issue_body<<EOF'
            printf '%s\n' "$issue_body"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Parse issue body
        id: parse_request
        uses: issue-ops/parser@v5
        with:
          body: ${{ steps.issue_context.outputs.issue_body }}
          issue-form-template: add-child-teams.yml

      - name: Check request applicability
        id: request_scope
        env:
          PARSED_REQUEST_JSON: ${{ steps.parse_request.outputs.json }}
          PARSED_PARENT_TEAM: ${{ steps.parse_request.outputs.parsed_parent_team }}
          PARSED_DESIGNATED_HIERARCHY_APPROVER: ${{ steps.parse_request.outputs.parsed_designated_hierarchy_approver }}
          PARSED_DESIGNATED_APPROVER: ${{ steps.parse_request.outputs.parsed_designated_approver }}
        run: |
          set -euo pipefail

          matches_request=false
          parsed_parent_team="${PARSED_PARENT_TEAM:-}"
          parsed_designated_approver="${PARSED_DESIGNATED_HIERARCHY_APPROVER:-${PARSED_DESIGNATED_APPROVER:-}}"

          if [ -n "${PARSED_REQUEST_JSON:-}" ] && [ "$PARSED_REQUEST_JSON" != 'null' ]; then
            json_parent_team=$(printf '%s' "$PARSED_REQUEST_JSON" | jq -r '.parent_team // .parsed_parent_team // empty' 2>/dev/null || true)
            json_designated_approver=$(printf '%s' "$PARSED_REQUEST_JSON" | jq -r '.designated_hierarchy_approver // .parsed_designated_hierarchy_approver // .designated_approver // .parsed_designated_approver // empty' 2>/dev/null || true)

            if [ -z "$parsed_parent_team" ] && [ -n "$json_parent_team" ]; then
              parsed_parent_team="$json_parent_team"
            fi
            if [ -z "$parsed_designated_approver" ] && [ -n "$json_designated_approver" ]; then
              parsed_designated_approver="$json_designated_approver"
            fi
          fi

          if [ -n "$parsed_parent_team" ] && [ -n "$parsed_designated_approver" ]; then
            matches_request=true
          fi

          echo "matches-request=$matches_request" >> "$GITHUB_OUTPUT"

      - name: Skip unrelated issue form
        if: ${{ steps.request_scope.outputs.matches-request != 'true' }}
        run: |
          echo 'This issue does not match the add-child-teams form. Exiting without validation or assignment.' >> "$GITHUB_STEP_SUMMARY"

      - name: Restore prior request audit artifact
        if: ${{ steps.request_scope.outputs.matches-request == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AUDIT_ARTIFACT_PATH: artifacts/add-child-teams-validation-${{ env.ISSUE_NUMBER || 'manual' }}.json
        run: node src/scripts/restore-request-audit-artifact.js

      - name: Validate request and record approval-ready state
        id: validate_request
        if: ${{ steps.request_scope.outputs.matches-request == 'true' }}
        env:
          ISSUEOPS_GITHUB_TOKEN: ${{ secrets.ISSUEOPS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          REQUESTER_LOGIN: ${{ steps.issue_context.outputs.requester_login }}
          PARSED_REQUEST_JSON: ${{ steps.parse_request.outputs.json }}
          PARSED_ORGANIZATION: ${{ steps.parse_request.outputs.parsed_organization }}
          PARSED_PARENT_TEAM: ${{ steps.parse_request.outputs.parsed_parent_team }}
          PARSED_DESIGNATED_HIERARCHY_APPROVER: ${{ steps.parse_request.outputs.parsed_designated_hierarchy_approver }}
          PARSED_DESIGNATED_APPROVER: ${{ steps.parse_request.outputs.parsed_designated_approver }}
          PARSED_INTAKE_MODE: ${{ steps.parse_request.outputs.parsed_intake_mode }}
          PARSED_REQUESTED_CHILD_TEAMS: ${{ steps.parse_request.outputs.parsed_requested_child_teams }}
          PARSED_BULK_CSV_REQUESTED_CHILD_TEAMS: ${{ steps.parse_request.outputs.parsed_bulk_csv_requested_child_teams }}
          PARSED_BUSINESS_JUSTIFICATION: ${{ steps.parse_request.outputs.parsed_business_justification }}
          PARSED_DRY_RUN: ${{ steps.parse_request.outputs.parsed_dry_run }}
          TEAM_HIERARCHY_POLICY_JSON: ${{ vars.TEAM_HIERARCHY_POLICY_JSON || '' }}
          ISSUE_LABELS_JSON: ${{ steps.issue_context.outputs.issue_labels_json }}
          COMMENT_ID: ${{ github.event.comment.id || '' }}
          COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          AUDIT_ARTIFACT_PATH: artifacts/add-child-teams-validation-${{ env.ISSUE_NUMBER || 'manual' }}.json
        run: node src/scripts/run-request-validation.js

      - name: Evaluate approval gate and assign central owner
        id: approval_gate
        if: ${{ always() && steps.request_scope.outputs.matches-request == 'true' && steps.validate_request.outcome != 'skipped' }}
        env:
          ISSUEOPS_GITHUB_TOKEN: ${{ secrets.ISSUEOPS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          AUDIT_ARTIFACT_PATH: artifacts/add-child-teams-validation-${{ env.ISSUE_NUMBER || 'manual' }}.json
        run: node src/scripts/run-approval-gate.js

      - name: Execute approved hierarchy reconciliation
        id: execute_request
        if: ${{ always() && steps.request_scope.outputs.matches-request == 'true' && steps.approval_gate.outputs.approval-status == 'approved' }}
        env:
          ISSUEOPS_GITHUB_TOKEN: ${{ secrets.ISSUEOPS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          AUDIT_ARTIFACT_PATH: artifacts/add-child-teams-validation-${{ env.ISSUE_NUMBER || 'manual' }}.json
        run: node src/scripts/run-approved-execution.js

      - name: Upload validation artifact
        if: ${{ always() && steps.request_scope.outputs.matches-request == 'true' && steps.validate_request.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: add-child-teams-validation-${{ env.ISSUE_NUMBER || github.run_id }}
          path: artifacts/add-child-teams-validation-${{ env.ISSUE_NUMBER || 'manual' }}.json
          if-no-files-found: error