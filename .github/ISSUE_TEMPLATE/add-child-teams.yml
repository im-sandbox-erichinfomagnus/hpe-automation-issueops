name: Add child teams
description: Request attaching one or more existing child teams under one existing parent team in a GitHub organization.
title: "[add-child-teams] <org>: <parent-team>"
labels:
  - issueops
  - add-child-teams
body:
  - type: input
    id: organization
    attributes:
      label: Target organization
      description: GitHub organization where the requested team hierarchy change should be applied.
      value: im-sandbox-erichinfomagnus
      placeholder: octo-org
    validations:
      required: true

  - type: input
    id: parent_team
    attributes:
      label: Parent team
      description: Existing parent team that should receive the requested child teams.
      placeholder: platform-engineering
    validations:
      required: true

  - type: input
    id: designated_hierarchy_approver
    attributes:
      label: Designated hierarchy approver
      description: GitHub login of the single approver who must be a current maintainer of the requested parent team and every requested child team in this batch.
      placeholder: octocat
    validations:
      required: true

  - type: dropdown
    id: intake_mode
    attributes:
      label: Intake mode
      description: Choose how requested child teams will be provided for this request.
      options:
        - manual
        - csv_attachment
      default: 0
    validations:
      required: true

  - type: textarea
    id: requested_child_teams
    attributes:
      label: Requested child teams (manual mode only)
      description: Use this field only when intake mode is manual and provide one existing child team per line. Leave this field empty when intake mode is csv_attachment. Duplicate child teams, re-parenting requests, cycle-creating requests, and team-creation or member-management instructions are rejected.
      placeholder: |
        application-platform
        release-engineering
      render: text
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### CSV Attachment Mode Instructions

        When intake mode is `csv_attachment`:
        1. Submit this issue with `Requested child teams` left empty.
        2. Post a same-issue comment authored by the requester with exactly one CSV attachment.
        3. Use UTF-8 CSV with header `child_team` and one child team per data row.
        4. The request remains `waiting_for_attachment` until a qualifying attachment is accepted.

  - type: textarea
    id: business_justification
    attributes:
      label: Business justification
      description: Explain why this hierarchy change is needed. This workflow only validates and prepares approval-ready hierarchy requests in this phase.
      placeholder: These existing teams should roll up under the parent team to align delegated ownership and hierarchy reporting.
    validations:
      required: true

  - type: dropdown
    id: dry_run
    attributes:
      label: Dry-run mode
      description: Validation runs without hierarchy mutation in this phase. Keep dry-run enabled for request review and reconciliation preview.
      options:
        - "true"
        - "false"
      default: 1
    validations:
      required: true