name: Create tenant repositories
description: Request creation of a tenant-scoped repository managed by the tenant repo-admin team.
title: "[create-tenant-repos] <org>/<repo>: <summary>"
labels:
  - issueops
  - create-tenant-repos
body:
  - type: input
    id: organization
    attributes:
      label: Target organization
      description: GitHub organization where the repository should be created.
      placeholder: octo-org
    validations:
      required: true

  - type: input
    id: tenant_name
    attributes:
      label: Tenant name
      description: Human-readable tenant name exactly as defined in tenant-registry for the target organization.
      placeholder: ContosoUK
    validations:
      required: true

  - type: dropdown
    id: intake_mode
    attributes:
      label: Intake mode
      description: >-
        Choose how repositories are supplied. single uses the single-item fields
        below. bulk_csv pastes the spreadsheet batch directly into the CSV field.
        csv_attachment leaves the repository fields blank and uploads a .csv file
        as an attachment in a follow-up issue comment.
      options:
        - single
        - bulk_csv
        - csv_attachment
      default: 0
    validations:
      required: true

  - type: textarea
    id: repositories_csv
    attributes:
      label: Repositories CSV (spreadsheet batch)
      description: >-
        Primary input for bulk_csv intake. Paste one row per repository in the column order
        repository_name,repository_visibility,primary_contact,secondary_contact.
        One issue can create many repositories in the resolved tenant boundary.
        An optional header row is allowed. The single-item fields below are used
        only when this is empty. Leave this blank when intake mode is csv_attachment.
      placeholder: |
        repository_name,repository_visibility,primary_contact,secondary_contact
        acme-platform-service,private,octocat,hubot
        acme-web,internal,octocat,
        acme-docs,public,alice@example.com,
    validations:
      required: false

  - type: input
    id: repository_name
    attributes:
      label: Repository name (optional, single-item path)
      description: Name for exactly one repository to create within the resolved tenant boundary (do not include owner or organization prefix). Used only when the CSV batch is empty.
      placeholder: acme-platform-service
    validations:
      required: false

  - type: dropdown
    id: repository_visibility
    attributes:
      label: Repository visibility (single-item path)
      description: Requested visibility for the single-item repository. Used only when the CSV batch is empty.
      options:
        - private
        - internal
        - public
      default: 0
    validations:
      required: false

  - type: input
    id: primary_contact
    attributes:
      label: Primary contact (single-item path)
      description: >
        Optional. GitHub username (handle) of the primary business owner for the single-item repository.
        A GitHub handle is preferred (for example, octocat or @octocat).
        If the person does not have a GitHub account, a work email address is accepted
        as a fallback (for example, alice@example.com). Validated for handle or email format
        when provided. Used only when the CSV batch is empty.
        Future enhancement: automatic GitHub handle validation may be integrated via
        the GitHub Users API.
      placeholder: octocat
    validations:
      required: false

  - type: input
    id: secondary_contact
    attributes:
      label: Secondary contact (optional, single-item path)
      description: >
        GitHub username (handle) or work email of a secondary or backup business owner
        for the single-item repository.
        A GitHub handle is preferred (for example, octocat or @octocat).
        Future enhancement: automatic GitHub handle validation may be integrated via
        the GitHub Users API.
      placeholder: octocat
    validations:
      required: false

  - type: dropdown
    id: dry_run
    attributes:
      label: Dry-run mode
      description: Dry-run validates tenant context and planned mutation without creating the repository.
      options:
        - "true"
        - "false"
      default: 1
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Business justification
      description: Explain why this repository is needed for the tenant.
      placeholder: Create an in-tenant service repository managed by tenant repo admins.
    validations:
      required: true
