name: Add team members
description: Request adding one or more people to a GitHub organization team.
title: "[add-team-members] <org>/<team>: <summary>"
labels:
  - issueops
  - add-team-members
body:
  - type: markdown
    attributes:
      value: |
        Use this request to validate and, after approval, add one or more people
        to a team in a GitHub organization.

  - type: input
    id: organization
    attributes:
      label: Target organization
      description: GitHub organization that owns the target team.
      placeholder: octo-org
    validations:
      required: true

  - type: input
    id: team_slug
    attributes:
      label: Team slug
      description: Team slug, not the display name.
      placeholder: platform-engineering
    validations:
      required: true

  - type: dropdown
    id: intake_mode
    attributes:
      label: Intake mode
      description: Choose whether to enter usernames directly or upload a CSV in a follow-up issue comment.
      options:
        - manual
        - csv_attachment
      default: 0
    validations:
      required: true

  - type: textarea
    id: requested_people
    attributes:
      label: Requested people
      description: Manual input path. Enter one GitHub username per line, or use comma-separated values for backward compatibility. Leave this blank when intake mode is csv_attachment.
      placeholder: |
        octocat
        hubot
      render: text
    validations:
      required: false

  - type: textarea
    id: business_justification
    attributes:
      label: Business justification
      description: Explain why this team membership is needed. Validation runs before approval and no membership mutation occurs in this intake flow.
      placeholder: Access is required to support the release pipeline.
    validations:
      required: true

  - type: dropdown
    id: dry_run
    attributes:
      label: Dry-run mode
      description: Validation should run without mutation until approval is granted.
      options:
        - "true"
        - "false"
      default: 0
    validations:
      required: true
