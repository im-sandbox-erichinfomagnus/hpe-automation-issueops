name: Delete repository ruleset
description: Request deletion of a repository-level ruleset on a tenant repository, authorized by active tenant repo-admin team membership.
title: "[delete-repository-ruleset] <org>/<repository>: <ruleset-name>"
labels:
  - issueops
  - delete-repository-ruleset
body:
  - type: input
    id: organization
    attributes:
      label: Target organization
      description: GitHub organization that owns the tenant repository.
      placeholder: octo-org
    validations:
      required: true

  - type: input
    id: tenant_name
    attributes:
      label: Tenant name (optional)
      description: Human-readable tenant name as defined in tenant-registry, if the repository belongs to a tenant. Leave blank for imported repositories that are not in the tenant model.
      placeholder: Acme Platform
    validations:
      required: false

  - type: input
    id: repository
    attributes:
      label: Target repository
      description: Repository name in the target organization. Authorization is by admin permission on this repository.
      placeholder: acme-service-api
    validations:
      required: true

  - type: input
    id: ruleset_name
    attributes:
      label: Ruleset name
      description: Name of the repository ruleset to delete. Deletion is a no-op when the named ruleset is absent.
      placeholder: acme-default-branch-protection
    validations:
      required: true

  - type: input
    id: designated_approver
    attributes:
      label: Designated approver
      description: GitHub login for the authorized approver who will post the approval comment (must be an active organization owner).
      placeholder: org-owner-user
    validations:
      required: true

  - type: dropdown
    id: dry_run
    attributes:
      label: Dry-run mode
      description: Dry-run validates tenant context and planned mutation without changing any repository ruleset.
      options:
        - "true"
        - "false"
      default: 0
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Business justification
      description: Explain why this repository ruleset should be removed.
      placeholder: Retire the deprecated branch protection ruleset for the tenant repository.
    validations:
      required: true
