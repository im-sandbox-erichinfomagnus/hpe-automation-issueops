name: Create tenant model
description: Request tenant bootstrap teams, hierarchy, and requester maintainer setup.
title: "[create-tenant-model] <org>/<tenant>: <summary>"
labels:
  - issueops
  - create-tenant-model
body:
  - type: input
    id: organization
    attributes:
      label: Target organization
      description: GitHub organization where tenant teams will be created.
      placeholder: octo-org
    validations:
      required: true

  - type: input
    id: tenant_name
    attributes:
      label: Tenant name
      description: Human-readable tenant name used to derive deterministic team names.
      placeholder: Acme
    validations:
      required: false

  - type: textarea
    id: tenant_csv
    attributes:
      label: Tenant CSV (spreadsheet input)
      description: >-
        Preferred input. Paste exactly one tenant row using the columns shown below.
        The header is optional. When supplied, this row overrides the individual tenant fields.
      placeholder: |
        tenant_name,tenant_admin_login,tenant_type,cmdb_id,cost_center,business_unit,environment,primary_contact,secondary_contact,code_scanning_enabled,secret_scanning_enabled,dependabot_enabled
        DemoCorp,user1,platform,CMDB-1001,CC-1001,Compute,nonprod,owner@example.com,backup@example.com,true,true,true
    validations:
      required: false

  - type: input
    id: tenant_admin_login
    attributes:
      label: Tenant admin GitHub login (single-item fallback)
      description: Active organization member who becomes maintainer of the tenant root, admin, RepoAdmin, and CICDAdmin teams. Used when Tenant CSV is empty.
      placeholder: user1
    validations:
      required: false

  - type: dropdown
    id: tenant_type
    attributes:
      label: Tenant type
      description: Canonical tenant type used for topology governance.
      options:
        - application
        - platform
        - shared-services
      default: 0
    validations:
      required: true

  - type: dropdown
    id: governance_code_scanning_enabled
    attributes:
      label: Enable code scanning
      options:
        - "true"
        - "false"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: governance_secret_scanning_enabled
    attributes:
      label: Enable secret scanning
      options:
        - "true"
        - "false"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: governance_dependabot_enabled
    attributes:
      label: Enable dependabot
      options:
        - "true"
        - "false"
      default: 0
    validations:
      required: true

  - type: input
    id: cmdb_id
    attributes:
      label: CMDB ID
      placeholder: CMDB-0001
    validations:
      required: false

  - type: input
    id: cost_center
    attributes:
      label: Cost center
      placeholder: CC-0001
    validations:
      required: false

  - type: input
    id: business_unit
    attributes:
      label: Business unit
      placeholder: platform
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - nonprod
        - prod
      default: 0
    validations:
      required: false

  - type: input
    id: primary_contact
    attributes:
      label: Primary contact
      description: Optional email contact for tenant ownership. Validated for email format when provided.
      placeholder: owner@example.com
    validations:
      required: false

  - type: input
    id: secondary_contact
    attributes:
      label: Secondary contact (optional)
      description: Optional backup email contact.
      placeholder: backup@example.com
    validations:
      required: false

  - type: dropdown
    id: dry_run
    attributes:
      label: Dry-run mode
      description: Dry-run validates and plans reconciliation without mutation.
      options:
        - "true"
        - "false"
      default: 1
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Business justification
      description: Explain why this tenant bootstrap operation is required.
      placeholder: Tenant needs isolated administration teams.
    validations:
      required: true
